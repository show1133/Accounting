<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日常帳務管理台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
/* 版面：上方標題列 + 下方左右雙欄（左＝重點項目導覽，右＝內容，底部翻頁） */
:root{
  --bg:#f4f5f8; --panel:#ffffff; --panel-2:#eef0f5; --line:#d6dae3;
  --fg:#101317; --muted:#5b6475; --shadow:0 1px 2px rgba(16,19,23,.07),0 8px 24px rgba(16,19,23,.05);
  --title:#0b3fa8;       /* 標題：藍字粗體 */
  --key:#c81e1e;         /* 重點：紅字粗體 */
  --sub:#2563c9;         /* 次要重點：藍字細體 */
  --body:#101317;        /* 一般文字：黑字細體 */
  --accent:#3755d8; --accent-ink:#ffffff; --accent-soft:#e6eaff;
  --ok:#0f7a4d; --warn:#b45309; --bad:#c81e1e;
  --c-l:44%; --c-s:62%;
  --font-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0f1218; --panel:#161b24; --panel-2:#1d2430; --line:#2b3442;
  --fg:#e7ebf2; --muted:#98a3b6; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --title:#7fb0ff; --key:#ff8080; --sub:#9cc2ff; --body:#e7ebf2;
  --accent-soft:#232c4a; --ok:#54c79a; --warn:#e0a458; --bad:#ff8080;
  --c-l:66%; --c-s:58%; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1218; --panel:#161b24; --panel-2:#1d2430; --line:#2b3442;
  --fg:#e7ebf2; --muted:#98a3b6; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --title:#7fb0ff; --key:#ff8080; --sub:#9cc2ff; --body:#e7ebf2;
  --accent-soft:#232c4a; --ok:#54c79a; --warn:#e0a458; --bad:#ff8080;
  --c-l:66%; --c-s:58%; color-scheme:dark;
}
/* 色系（使用者可切換） */
:root[data-palette="indigo"]{--accent:#3755d8}
:root[data-palette="teal"]  {--accent:#0e8f86}
:root[data-palette="amber"] {--accent:#b06f0d}
:root[data-palette="rose"]  {--accent:#b43b63}
:root[data-palette="slate"] {--accent:#475569}
:root[data-palette="teal"]  { --accent-soft:#d9f2ef }
:root[data-palette="amber"] { --accent-soft:#fdeed6 }
:root[data-palette="rose"]  { --accent-soft:#fce3eb }
:root[data-palette="slate"] { --accent-soft:#e4e8ef }
:root[data-theme="dark"][data-palette="teal"],
:root[data-theme="dark"][data-palette="amber"],
:root[data-theme="dark"][data-palette="rose"],
:root[data-theme="dark"][data-palette="slate"]{--accent-soft:#232c3a}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"])[data-palette="teal"],
  :root:not([data-theme="light"])[data-palette="amber"],
  :root:not([data-theme="light"])[data-palette="rose"],
  :root:not([data-theme="light"])[data-palette="slate"]{--accent-soft:#232c3a}
  :root:not([data-theme="light"])[data-palette="teal"]{--accent:#2bb3a6}
  :root:not([data-theme="light"])[data-palette="amber"]{--accent:#d99a3c}
  :root:not([data-theme="light"])[data-palette="rose"]{--accent:#e36a93}
  :root:not([data-theme="light"])[data-palette="slate"]{--accent:#8ea2c0}
  :root:not([data-theme="light"])[data-palette="indigo"]{--accent:#7d93ff}
}
:root[data-theme="dark"][data-palette="teal"]{--accent:#2bb3a6}
:root[data-theme="dark"][data-palette="amber"]{--accent:#d99a3c}
:root[data-theme="dark"][data-palette="rose"]{--accent:#e36a93}
:root[data-theme="dark"][data-palette="slate"]{--accent:#8ea2c0}
:root[data-theme="dark"][data-palette="indigo"]{--accent:#7d93ff}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--font-body);font-weight:400;font-size:15px;line-height:1.65}
*{box-sizing:border-box}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 文字規範 */
.t-title{color:var(--title);font-weight:700}
.t-key{color:var(--key);font-weight:700}
.t-sub{color:var(--sub);font-weight:400}
.t-body{color:var(--body);font-weight:400}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* 上框 */
.frame-top{background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{padding-block:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.brand h1{margin:0;font-size:19px;letter-spacing:.3px;color:var(--title);font-weight:700}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.top-tools{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.toolgrp{display:flex;align-items:center;gap:7px}
.toolgrp>span{font-size:11.5px;color:var(--muted);letter-spacing:.08em}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--panel) inset}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--muted);font:inherit;font-size:12.5px;padding:5px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* 下框 */
.frame-lower{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:0}
.frame-left{background:var(--panel-2);border-right:1px solid var(--line);overflow:auto}
.left-in{padding-block:14px}
.left-h{font-size:11.5px;letter-spacing:.14em;color:var(--muted);margin:0 0 9px}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.nav button{width:100%;text-align:left;border:0;background:transparent;font:inherit;color:var(--body);padding:9px 11px;border-radius:8px;cursor:pointer;display:flex;gap:9px;align-items:baseline}
.nav button:hover{background:var(--panel)}
.nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.nav button[aria-current="true"] small{color:var(--accent-ink);opacity:.8}
.nav .no{font-family:var(--font-mono);font-size:11px;opacity:.65;flex:none}
.nav small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.nav b{font-weight:500;font-size:14px}

.frame-right{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.content{overflow:auto;flex:1;min-height:0}
.content-in{padding-block:20px 26px;max-width:960px}
.pager{border-top:1px solid var(--line);background:var(--panel)}
.pager-in{padding-block:10px;display:flex;align-items:center;gap:10px}
.pager .mid{flex:1;text-align:center;font-size:12px;color:var(--muted);min-width:0}
button.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--body);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13.5px}
button.btn:hover{border-color:var(--accent)}
button.btn:disabled{opacity:.4;cursor:not-allowed}
button.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

h2.sec{font-size:21px;margin:0 0 4px;color:var(--title);font-weight:700;text-wrap:balance}
h3.sub{font-size:15px;margin:22px 0 8px;color:var(--title);font-weight:700}
.lead{color:var(--muted);margin:0 0 18px;font-size:13.5px;max-width:62ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi .lab{font-size:12px;color:var(--muted);margin-bottom:4px}
.kpi .val{font-family:var(--font-mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.kpi .dl{font-size:11.5px;color:var(--muted);margin-top:3px}
.pos{color:var(--ok)} .neg{color:var(--bad)}

label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select,textarea{font:inherit;font-size:14px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
textarea{min-height:92px;font-family:var(--font-mono);font-size:12.5px;line-height:1.6}
.row{display:grid;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 11px;font-size:13px}
.chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;border-radius:50%}
.chip button:hover{color:var(--bad)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.06em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel-2)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.note{background:var(--accent-soft);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:11px 13px;font-size:13px;margin:14px 0}
.bar{height:8px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
pre.code{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;font-family:var(--font-mono);font-size:12.3px;line-height:1.65;white-space:pre-wrap;word-break:break-word;margin:0}
ul.clean{margin:8px 0;padding-left:20px}
ul.clean li{margin:4px 0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;background:var(--panel);cursor:pointer}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:14px}
svg.chart{display:block;width:100%;height:auto;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:30;box-shadow:var(--shadow)}
@media (max-width:820px){
  .frame-lower{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .frame-left{border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .nav{flex-direction:row;gap:6px}
  .nav li{flex:none}
  .nav button{white-space:nowrap;padding:7px 12px}
  .nav small{display:none}
  .g4,.g3,.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:460px){ .g4,.g3,.g2{grid-template-columns:1fr} .brand p{display:none} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="frame-top">
    <div class="top-in gut">
      <div class="brand">
        <div class="mark">帳</div>
        <div>
          <h1>日常帳務管理台</h1>
          <p>記帳 · 帳單匯入 · 財務分析 · GitHub 同步</p>
        </div>
      </div>
      <div class="top-tools">
        <div class="toolgrp"><span>色系</span><div id="pal" class="chips" style="gap:6px"></div></div>
        <div class="toolgrp"><span>明暗</span>
          <div class="seg" id="thm">
            <button data-t="auto" aria-pressed="true">系統</button>
            <button data-t="light" aria-pressed="false">亮</button>
            <button data-t="dark" aria-pressed="false">暗</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="frame-lower">
    <nav class="frame-left" aria-label="重點項目">
      <div class="left-in gut">
        <p class="left-h">重 點 項 目</p>
        <ul class="nav" id="nav"></ul>
      </div>
    </nav>

    <section class="frame-right">
      <div class="content" id="scroller">
        <div class="content-in gut" id="content"></div>
      </div>
      <div class="pager">
        <div class="pager-in gut">
          <button class="btn" id="prev">← 上一頁</button>
          <div class="mid" id="pmid"></div>
          <button class="btn" id="next">下一頁 →</button>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
/* ---------- 資料 ---------- */
var KEY='ledger.v2', PKEY='ledger.pref.v2';
var CATS=['餐飲','交通','居住','娛樂','醫療','教育','購物','保險','其他','薪資','獎金'];
var INCOME_CATS=['薪資','獎金'];

function seed(){
  var r=[],id=1;
  var d=[
    ['2026-07-05','薪資','七月薪資',62000,'收入','轉帳'],
    ['2026-07-06','居住','房租',18000,'支出','轉帳'],
    ['2026-07-09','餐飲','超市採買',2480,'支出','信用卡'],
    ['2026-07-15','交通','悠遊卡加值',1000,'支出','現金'],
    ['2026-07-21','娛樂','影音訂閱',390,'支出','信用卡'],
    ['2026-07-28','購物','夏季衣物',3200,'支出','信用卡'],
    ['2026-08-05','薪資','八月薪資',62000,'收入','轉帳'],
    ['2026-08-06','居住','房租',18000,'支出','轉帳'],
    ['2026-08-11','餐飲','外食合計',6900,'支出','信用卡'],
    ['2026-08-17','醫療','牙科回診',1800,'支出','現金'],
    ['2026-08-23','交通','高鐵台北-台中',1490,'支出','信用卡'],
    ['2026-08-30','保險','醫療險季繳',7200,'支出','轉帳'],
    ['2026-09-05','薪資','九月薪資',62000,'收入','轉帳'],
    ['2026-09-06','居住','房租',18000,'支出','轉帳'],
    ['2026-09-12','餐飲','外食合計',7450,'支出','信用卡'],
    ['2026-09-14','教育','線上課程',2990,'支出','信用卡'],
    ['2026-09-25','購物','家電維修',4600,'支出','信用卡'],
    ['2026-09-28','娛樂','週末小旅行',5300,'支出','信用卡'],
    ['2026-10-05','薪資','十月薪資',62000,'收入','轉帳'],
    ['2026-10-05','獎金','專案獎金',12000,'收入','轉帳'],
    ['2026-10-06','居住','房租',18000,'支出','轉帳'],
    ['2026-10-08','餐飲','超市採買',3120,'支出','信用卡'],
    ['2026-10-11','交通','加油',1650,'支出','信用卡'],
    ['2026-10-14','娛樂','影音訂閱',390,'支出','信用卡'],
    ['2026-10-16','購物','生活用品',2180,'支出','信用卡']
  ];
  d.forEach(function(x){
    r.push({id:id++,date:x[0],ym:x[0].slice(0,7),cat:x[1],item:x[2],amount:x[3],type:x[4],pay:x[5],note:'',demo:true});
  });
  return r;
}
var S=null;
try{ var raw=localStorage.getItem(KEY); if(raw) S=JSON.parse(raw); }catch(e){}
if(!S||!S.records){
  S={records:seed(),cats:CATS.slice(),months:['2026-07','2026-08','2026-09','2026-10'],
     budgets:{'餐飲':8000,'居住':18000,'交通':3000,'娛樂':4000,'購物':5000},
     github:{owner:'',repo:'',branch:'main',path:'data/ledger.json'}};
}
if(!S.github) S.github={owner:'',repo:'',branch:'main',path:'data/ledger.json'};
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

var PREF={palette:'indigo',theme:'auto'};
try{ var p=localStorage.getItem(PKEY); if(p) PREF=JSON.parse(p); }catch(e){}
function savePref(){ try{ localStorage.setItem(PKEY,JSON.stringify(PREF)); }catch(e){} }

/* ---------- 色系 / 明暗 ---------- */
var PALETTES=[['indigo','靛藍','#3755d8'],['teal','青碧','#0e8f86'],['amber','琥珀','#b06f0d'],['rose','玫瑰','#b43b63'],['slate','石墨','#475569']];
function applyPref(){
  document.documentElement.setAttribute('data-palette',PREF.palette);
  if(PREF.theme==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',PREF.theme);
  Array.prototype.forEach.call(document.querySelectorAll('#pal .sw'),function(b){ b.setAttribute('aria-pressed',b.dataset.p===PREF.palette?'true':'false'); });
  Array.prototype.forEach.call(document.querySelectorAll('#thm button'),function(b){ b.setAttribute('aria-pressed',b.dataset.t===PREF.theme?'true':'false'); });
}
(function(){
  var h='';
  PALETTES.forEach(function(p){ h+='<button class="sw" data-p="'+p[0]+'" title="'+p[1]+'" aria-label="'+p[1]+'色系" style="background:'+p[2]+'"></button>'; });
  document.getElementById('pal').innerHTML=h;
})();
document.getElementById('pal').addEventListener('click',function(e){
  var b=e.target.closest('.sw'); if(!b) return; PREF.palette=b.dataset.p; savePref(); applyPref(); render();
});
document.getElementById('thm').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return; PREF.theme=b.dataset.t; savePref(); applyPref(); render();
});

/* ---------- 工具 ---------- */
function money(n){ return 'NT$'+Math.round(n).toLocaleString('zh-TW'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function catColor(c){
  var i=S.cats.indexOf(c); if(i<0) i=0;
  var hues=[12,205,38,268,162,330,88,242,186,52,300];
  return 'hsl('+hues[i%hues.length]+' var(--c-s) var(--c-l))';
}
function months(){
  var m={}; S.records.forEach(function(r){ m[r.ym]=1; }); (S.months||[]).forEach(function(x){ m[x]=1; });
  return Object.keys(m).sort();
}
function sumBy(list,f){ var t=0; list.forEach(function(r){ t+=f(r); }); return t; }
function monthStat(ym){
  var rs=S.records.filter(function(r){return r.ym===ym;});
  var inc=sumBy(rs,function(r){return r.type==='收入'?r.amount:0;});
  var exp=sumBy(rs,function(r){return r.type==='支出'?r.amount:0;});
  return {ym:ym,inc:inc,exp:exp,net:inc-exp,n:rs.length};
}
function toast(msg){
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(function(){ t.remove(); },2000);
}
function copyText(txt,btn){
  var done=function(){ if(btn){var o=btn.textContent;btn.textContent='已複製 ✓';setTimeout(function(){btn.textContent=o;},1600);} };
  try{ navigator.clipboard.writeText(txt).then(done,function(){ fallback(); }); }catch(e){ fallback(); }
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e2){ toast('請手動選取文字複製'); }
    ta.remove();
  }

/* ---------- 圖表 ---------- */
function barChart(data){
  var W=720,H=250,pl=58,pr=12,pt=14,pb=34, iw=W-pl-pr, ih=H-pt-pb;
  var max=1; data.forEach(function(d){ max=Math.max(max,d.inc,d.exp); });
  var step=Math.pow(10,Math.floor(Math.log(max)/Math.LN10)); var top=Math.ceil(max/step)*step; if(top===0)top=1;
  var n=data.length||1, gw=iw/n, bw=Math.min(26,gw/3.2);
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="每月收入與支出長條圖">';
  for(var i=0;i<=4;i++){
    var v=top*i/4, y=pt+ih-ih*i/4;
    s+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="var(--font-mono)">'+(v>=1000?(v/1000)+'k':v)+'</text>';
  }
  data.forEach(function(d,k){
    var cx=pl+gw*k+gw/2;
    var hi=ih*d.inc/top, he=ih*d.exp/top;
    s+='<rect x="'+(cx-bw-3)+'" y="'+(pt+ih-hi)+'" width="'+bw+'" height="'+Math.max(hi,1)+'" rx="3" fill="var(--ok)"/>';
    s+='<rect x="'+(cx+3)+'" y="'+(pt+ih-he)+'" width="'+bw+'" height="'+Math.max(he,1)+'" rx="3" fill="var(--bad)"/>';
    s+='<text x="'+cx+'" y="'+(H-12)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+esc(d.ym.replace('-','/'))+'</text>';
  });
  s+='</svg>';
  s+='<div class="legend"><span><i class="dot" style="background:var(--ok)"></i>收入</span><span><i class="dot" style="background:var(--bad)"></i>支出</span></div>';
  return s;
}
function donut(items){
  var tot=sumBy(items,function(i){return i.value;}); if(tot<=0) return '<p class="t-sub">此期間尚無支出資料。</p>';
  var W=300,cx=150,cy=150,R=118,r=70, a=-Math.PI/2;
  var s='<svg class="chart" viewBox="0 0 '+W+' 300" style="max-width:300px;margin:0 auto" role="img" aria-label="支出類別占比環圈圖">';
  items.forEach(function(it){
    var ang=it.value/tot*Math.PI*2, a2=a+ang, big=ang>Math.PI?1:0;
    var x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    var x3=cx+r*Math.cos(a2),y3=cy+r*Math.sin(a2),x4=cx+r*Math.cos(a),y4=cy+r*Math.sin(a);
    s+='<path d="M'+x1+' '+y1+' A'+R+' '+R+' 0 '+big+' 1 '+x2+' '+y2+' L'+x3+' '+y3+' A'+r+' '+r+' 0 '+big+' 0 '+x4+' '+y4+' Z" fill="'+catColor(it.label)+'" stroke="var(--panel)" stroke-width="2"/>';
    a=a2;
  });
  s+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="12" fill="var(--muted)">總支出</text>';
  s+='<text x="'+cx+'" y="'+(cy+20)+'" text-anchor="middle" font-size="18" font-weight="600" fill="var(--fg)" font-family="var(--font-mono)">'+money(tot)+'</text></svg>';
  s+='<div class="legend">'+items.map(function(i){
    return '<span><i class="dot" style="background:'+catColor(i.label)+'"></i>'+esc(i.label)+' '+Math.round(i.value/tot*100)+'%</span>';
  }).join('')+'</div>';
  return s;
}

function pAnalysis(){
  var ms=months();
  var stats=ms.map(monthStat);
  var tInc=sumBy(stats,function(s){return s.inc;}), tExp=sumBy(stats,function(s){return s.exp;});
  var avgExp=ms.length?tExp/ms.length:0, rate=tInc?Math.round((tInc-tExp)/tInc*100):0;
  var last=ms[ms.length-1]||'';
  var byCat={}; S.records.filter(function(r){return r.type==='支出';}).forEach(function(r){ byCat[r.cat]=(byCat[r.cat]||0)+r.amount; });
  var items=Object.keys(byCat).map(function(k){return {label:k,value:byCat[k]};}).sort(function(a,b){return b.value-a.value;});
  var h='<h2 class="sec">財務分析</h2><p class="lead">涵蓋 '+esc(ms[0]||'—')+' 至 '+esc(last||'—')+' 共 '+ms.length+' 個月、'+S.records.length+' 筆紀錄。</p>';
  h+='<div class="grid g4">'+
    '<div class="card kpi"><div class="lab">累計收入</div><div class="val pos">'+money(tInc)+'</div></div>'+
    '<div class="card kpi"><div class="lab">累計支出</div><div class="val neg">'+money(tExp)+'</div></div>'+
    '<div class="card kpi"><div class="lab">月均支出</div><div class="val">'+money(avgExp)+'</div></div>'+
    '<div class="card kpi"><div class="lab">整體儲蓄率</div><div class="val '+(rate>=0?'pos':'neg')+'">'+rate+'%</div><div class="dl">'+(rate>=20?'體質良好':rate>=0?'仍有改善空間':'入不敷出')+'</div></div></div>';
  h+='<h3 class="sub">收支趨勢</h3><div class="card">'+barChart(stats.slice(-8))+'</div>';
  h+='<div class="grid g2" style="margin-top:12px"><div class="card"><p class="t-sub" style="margin:0 0 8px">全期支出類別占比</p>'+donut(items.slice(0,8))+'</div>';
  h+='<div class="card"><p class="t-sub" style="margin:0 0 10px">'+esc(last)+' 預算達成</p>';
  var budCats=Object.keys(S.budgets).filter(function(c){return S.budgets[c]>0;});
  if(!budCats.length) h+='<p class="t-body" style="font-size:13.5px">尚未設定預算，請到「月份與類別」頁填寫。</p>';
  else h+=budCats.map(function(c){
    var used=sumBy(S.records.filter(function(r){return r.ym===last&&r.cat===c&&r.type==='支出';}),function(r){return r.amount;});
    var pct=Math.min(200,Math.round(used/S.budgets[c]*100));
    var col=pct>100?'var(--bad)':pct>80?'var(--warn)':'var(--ok)';
    return '<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>'+esc(c)+'</span><span style="font-family:var(--font-mono);color:'+col+'">'+money(used)+' / '+money(S.budgets[c])+'（'+pct+'%）</span></div><div class="bar"><i style="width:'+Math.min(100,pct)+'%;background:'+col+'"></i></div></div>';
  }).join('');
  h+='</div></div>';
  var top=items.slice(0,3).map(function(i){return i.label;}).join('、');
  var over=budCats.filter(function(c){
    var used=sumBy(S.records.filter(function(r){return r.ym===last&&r.cat===c&&r.type==='支出';}),function(r){return r.amount;});
    return used>S.budgets[c];
  });
  h+='<h3 class="sub">觀察摘要</h3><div class="card"><ul class="clean">'+
     '<li><span class="t-sub">支出集中於：</span><span class="t-body">'+esc(top||'—')+'</span></li>'+
     '<li><span class="t-sub">月均支出：</span><span class="t-body">'+money(avgExp)+'，最高為 '+esc((stats.slice().sort(function(a,b){return b.exp-a.exp;})[0]||{ym:'—'}).ym)+'</span></li>'+
     (over.length?'<li><span class="t-key">超出預算：'+esc(over.join('、'))+'，建議下月調整。</span></li>':'<li><span class="t-body">本月各類別皆在預算內。</span></li>')+
     '</ul></div>';
  return h;
}

function ledgerRows(data){
  var list=Array.isArray(data)?data:(data&&Array.isArray(data.records)?data.records:null);
  if(!list) throw new Error('檔案需為帳務陣列，或含 records 的物件');
  return list.filter(function(x){ return x&&!x.demo; }).map(function(x,n){
    var date=String(x.date||''), amount=Number(x.amount), type=x.kind||x.type||'支出';
    var cat=String(x.category||x.cat||'').trim(), item=String(x.item||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||isNaN(Date.parse(date))) throw new Error('第 '+(n+1)+' 筆日期無效');
    if(!(amount>0)||!isFinite(amount)) throw new Error('第 '+(n+1)+' 筆金額無效');
    if(type!=='收入'&&type!=='支出') throw new Error('第 '+(n+1)+' 筆收支類型無效');
    if(!cat||!item) throw new Error('第 '+(n+1)+' 筆類別或項目空白');
    return {id:n+1,date:date,ym:date.slice(0,7),cat:cat,item:item,amount:Math.round(amount*100)/100,type:type,
      pay:String(x.payment||x.pay||'現金'),note:String(x.note||'')};
  });
}
function loadLedger(file){
  var box=document.getElementById('ledgermsg');
  if(file.size>20*1024*1024){ toast('檔案過大'); return; }
  var fr=new FileReader();
  fr.onload=function(){
    var rows;
    try{ rows=ledgerRows(JSON.parse(String(fr.result).replace(/^\uFEFF/,''))); }
    catch(err){ if(box) box.innerHTML='<div class="note"><span class="t-key">載入失敗：</span><span class="t-body">'+esc(String(err&&err.message||err))+'</span></div>'; return; }
    if(!confirm('將以檔案中的 '+rows.length+' 筆帳務取代網頁目前的 '+S.records.length+' 筆，確定？')) return;
    S.records=rows;
    // The Python ledger is the source of truth; drop months left over from the demo data.
    S.months=[];
    rows.forEach(function(r){
      if(S.cats.indexOf(r.cat)<0) S.cats.push(r.cat);
      if(S.months.indexOf(r.ym)<0) S.months.push(r.ym);
    });
    S.months.sort();
    save(); render(); toast('已載入 '+rows.length+' 筆帳務');
  };
  fr.onerror=function(){ toast('檔案讀取失敗'); };
  fr.readAsText(file);
}

/* ---------- PDF 解析 ---------- */
var KWMAP=[[/加油|中油|台塑|停車|捷運|客運|高鐵|台鐵|計程車|uber/i,'交通'],
  [/全聯|家樂福|超市|便利|7-?11|全家|美食|餐廳|咖啡|食品|飲/i,'餐飲'],
  [/電信|中華電信|台電|水費|瓦斯|租金|房租|管理費/i,'居住'],
  [/netflix|spotify|影城|電影|ktv|遊戲|旅|訂房/i,'娛樂'],
  [/藥局|診所|醫院|健保|牙/i,'醫療'],
  [/書|課程|補習|學費/i,'教育'],
  [/保險|人壽|產險/i,'保險'],
  [/momo|蝦皮|pchome|百貨|服飾|電商|購/i,'購物']];
function guessCat(desc){
  for(var i=0;i<KWMAP.length;i++){ if(KWMAP[i][0].test(desc) && S.cats.indexOf(KWMAP[i][1])>=0) return KWMAP[i][1]; }
  return S.cats.indexOf('其他')>=0?'其他':S.cats[0];
}
var SKIP=/本期應繳|最低應繳|循環利息|信用額度|前期餘額|繳款截止|小計|合計|總計|帳單金額|可用餘額/;
function parseLines(lines){
  var out=[], yr=new Date().getFullYear();
  var re=/(?:(\d{4})[\/\-年])?(\d{1,2})[\/\-月](\d{1,2})日?\s+(.{2,60}?)\s+\$?(-?[\d,]+(?:\.\d{1,2})?)\s*$/;
  lines.forEach(function(ln){
    var s=ln.replace(/\s+/g,' ').trim();
    if(!s||SKIP.test(s)) return;
    var m=s.match(re); if(!m) return;
    var amt=parseFloat(m[5].replace(/,/g,'')); if(!(amt>0)) return;
    var y=m[1]?+m[1]:yr, mo=('0'+m[2]).slice(-2), d=('0'+m[3]).slice(-2);
    if(+mo<1||+mo>12||+d<1||+d>31) return;
    var desc=m[4].replace(/[\s·.]+$/,'').trim();
    out.push({date:y+'-'+mo+'-'+d,item:desc,amount:Math.round(amt),cat:guessCat(desc),on:true});
  });
  return out;
}
function afterParse(){
  render();
  var box=document.getElementById('pdfmsg');
  if(box) box.innerHTML = pdfRows.length
    ? '<div class="note"><span class="t-sub">解析完成，共找出 '+pdfRows.length+' 筆可能的消費紀錄，請於下表核對。</span></div>'
    : '<div class="note"><span class="t-key">沒有找到可辨識的消費列。</span><span class="t-body">可能是掃描影像型帳單，或版面格式特殊；請改用下方「貼上帳單文字」，或手動於「新增帳務」輸入。</span></div>';
  if(box) box.scrollIntoView({block:'nearest'});
}
function importPdf(){
  var picked=pdfRows.filter(function(r){return r.on&&r.amount>0;});
  if(!picked.length){ toast('請至少勾選一筆'); return; }
  var added=0;
  picked.forEach(function(r){
    var dup=S.records.some(function(x){return x.date===r.date&&x.amount===r.amount&&x.item===r.item;});
    if(dup) return;
    S.records.push({id:Date.now()+Math.random(),date:r.date,ym:r.date.slice(0,7),cat:r.cat,item:r.item,
      amount:r.amount,type:'支出',pay:'信用卡',note:'帳單匯入'});
    added++;
  });
  save(); pdfRows=[]; render(); toast('已匯入 '+added+' 筆（略過重複 '+(picked.length-added)+' 筆）');
}
function bindDrop(){
  var d=document.getElementById('drop'), f=document.getElementById('file'); if(!d) return;
  d.onclick=function(){ f.click(); };
  d.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); f.click(); } };
  d.ondragover=function(e){ e.preventDefault(); d.classList.add('on'); };
  d.ondragleave=function(){ d.classList.remove('on'); };
  d.ondrop=function(e){ e.preventDefault(); d.classList.remove('on'); if(e.dataTransfer.files[0]) readPdf(e.dataTransfer.files[0]); };
  f.onchange=function(){ if(f.files[0]) readPdf(f.files[0]); };
}
function readPdf(file){
  var box=document.getElementById('pdfmsg');
  if(box) box.innerHTML='<div class="note"><span class="t-sub">正在讀取 '+esc(file.name)+' …</span></div>';
  if(!window.pdfjsLib){ if(box) box.innerHTML='<div class="note"><span class="t-key">PDF 解析元件載入失敗。</span><span class="t-body">請改用下方「貼上帳單文字」功能。</span></div>'; return; }
  try{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
  var fr=new FileReader();
  fr.onload=function(){
    // CMaps let pdf.js decode CJK CID fonts (common in Taiwanese bank statements).
    pdfjsLib.getDocument({data:new Uint8Array(fr.result),
      cMapUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',cMapPacked:true}).promise.then(function(doc){
      var jobs=[];
      for(var i=1;i<=doc.numPages;i++) jobs.push(doc.getPage(i).then(function(pg){ return pg.getTextContent(); }));
      return Promise.all(jobs);
    }).then(function(pages){
      var lines=[], itemCount=0;
      pages.forEach(function(tc){
        var rows={};
        itemCount+=tc.items.length;
        tc.items.forEach(function(it){
          var y=Math.round(it.transform[5]);
          (rows[y]=rows[y]||[]).push({x:it.transform[4],s:it.str});
        });
        Object.keys(rows).sort(function(a,b){return b-a;}).forEach(function(y){
          lines.push(rows[y].sort(function(a,b){return a.x-b.x;}).map(function(o){return o.s;}).join(' '));
        });
      });
      pdfRows=parseLines(lines);
      afterParse();
      if(!pdfRows.length && !lines.join('').trim()){
        var b2=document.getElementById('pdfmsg');
        if(b2 && itemCount) b2.innerHTML='<div class="note"><span class="t-key">這份 PDF 有文字，但字型無法轉成可讀文字。</span><span class="t-body">請改用 Python 程式匯入（python accounting.py import --pdf 檔名.pdf），或從 PDF 閱讀器複製文字貼到下方。</span></div>';
        else if(b2) b2.innerHTML='<div class="note"><span class="t-key">這份 PDF 沒有文字層，應為掃描影像。</span><span class="t-body">請先用 OCR 工具轉成可選取文字的 PDF，或改用下方貼上文字。</span></div>';
      }
    }).catch(function(err){
      var b3=document.getElementById('pdfmsg');
      if(b3) b3.innerHTML='<div class="note"><span class="t-key">讀取失敗：</span><span class="t-body">'+esc(String(err&&err.message||err))+'。若為加密帳單，請先解除密碼保護，或改用下方貼上文字。</span></div>';
    });
  };
  fr.onerror=function(){ if(box) box.innerHTML='<div class="note"><span class="t-key">檔案讀取失敗，請再試一次。</span></div>'; };
  fr.readAsArrayBuffer(file);
}

applyPref();
render();
</script>

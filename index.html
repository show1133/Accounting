<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日常帳務管理台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
/* 版面：上方標題列 + 下方左右雙欄（左＝重點項目導覽，右＝內容，底部翻頁） */
:root{
  --bg:#f4f5f8; --panel:#ffffff; --panel-2:#eef0f5; --line:#d6dae3;
  --fg:#101317; --muted:#5b6475; --shadow:0 1px 2px rgba(16,19,23,.07),0 8px 24px rgba(16,19,23,.05);
  --title:#0b3fa8;       /* 標題：藍字粗體 */
  --key:#c81e1e;         /* 重點：紅字粗體 */
  --sub:#2563c9;         /* 次要重點：藍字細體 */
  --body:#101317;        /* 一般文字：黑字細體 */
  --accent:#3755d8; --accent-ink:#ffffff; --accent-soft:#e6eaff;
  --ok:#0f7a4d; --warn:#b45309; --bad:#c81e1e;
  --c-l:44%; --c-s:62%;
  --font-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0f1218; --panel:#161b24; --panel-2:#1d2430; --line:#2b3442;
  --fg:#e7ebf2; --muted:#98a3b6; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --title:#7fb0ff; --key:#ff8080; --sub:#9cc2ff; --body:#e7ebf2;
  --accent-soft:#232c4a; --ok:#54c79a; --warn:#e0a458; --bad:#ff8080;
  --c-l:66%; --c-s:58%; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1218; --panel:#161b24; --panel-2:#1d2430; --line:#2b3442;
  --fg:#e7ebf2; --muted:#98a3b6; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --title:#7fb0ff; --key:#ff8080; --sub:#9cc2ff; --body:#e7ebf2;
  --accent-soft:#232c4a; --ok:#54c79a; --warn:#e0a458; --bad:#ff8080;
  --c-l:66%; --c-s:58%; color-scheme:dark;
}
/* 色系（使用者可切換） */
:root[data-palette="indigo"]{--accent:#3755d8}
:root[data-palette="teal"]  {--accent:#0e8f86}
:root[data-palette="amber"] {--accent:#b06f0d}
:root[data-palette="rose"]  {--accent:#b43b63}
:root[data-palette="slate"] {--accent:#475569}
:root[data-palette="teal"]  { --accent-soft:#d9f2ef }
:root[data-palette="amber"] { --accent-soft:#fdeed6 }
:root[data-palette="rose"]  { --accent-soft:#fce3eb }
:root[data-palette="slate"] { --accent-soft:#e4e8ef }
:root[data-theme="dark"][data-palette="teal"],
:root[data-theme="dark"][data-palette="amber"],
:root[data-theme="dark"][data-palette="rose"],
:root[data-theme="dark"][data-palette="slate"]{--accent-soft:#232c3a}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"])[data-palette="teal"],
  :root:not([data-theme="light"])[data-palette="amber"],
  :root:not([data-theme="light"])[data-palette="rose"],
  :root:not([data-theme="light"])[data-palette="slate"]{--accent-soft:#232c3a}
  :root:not([data-theme="light"])[data-palette="teal"]{--accent:#2bb3a6}
  :root:not([data-theme="light"])[data-palette="amber"]{--accent:#d99a3c}
  :root:not([data-theme="light"])[data-palette="rose"]{--accent:#e36a93}
  :root:not([data-theme="light"])[data-palette="slate"]{--accent:#8ea2c0}
  :root:not([data-theme="light"])[data-palette="indigo"]{--accent:#7d93ff}
}
:root[data-theme="dark"][data-palette="teal"]{--accent:#2bb3a6}
:root[data-theme="dark"][data-palette="amber"]{--accent:#d99a3c}
:root[data-theme="dark"][data-palette="rose"]{--accent:#e36a93}
:root[data-theme="dark"][data-palette="slate"]{--accent:#8ea2c0}
:root[data-theme="dark"][data-palette="indigo"]{--accent:#7d93ff}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--font-body);font-weight:400;font-size:15px;line-height:1.65}
*{box-sizing:border-box}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 文字規範 */
.t-title{color:var(--title);font-weight:700}
.t-key{color:var(--key);font-weight:700}
.t-sub{color:var(--sub);font-weight:400}
.t-body{color:var(--body);font-weight:400}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* 上框 */
.frame-top{background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{padding-block:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.brand h1{margin:0;font-size:19px;letter-spacing:.3px;color:var(--title);font-weight:700}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.top-tools{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.toolgrp{display:flex;align-items:center;gap:7px}
.toolgrp>span{font-size:11.5px;color:var(--muted);letter-spacing:.08em}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--panel) inset}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--muted);font:inherit;font-size:12.5px;padding:5px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* 下框 */
.frame-lower{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:0}
.frame-left{background:var(--panel-2);border-right:1px solid var(--line);overflow:auto}
.left-in{padding-block:14px}
.left-h{font-size:11.5px;letter-spacing:.14em;color:var(--muted);margin:0 0 9px}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.nav button{width:100%;text-align:left;border:0;background:transparent;font:inherit;color:var(--body);padding:9px 11px;border-radius:8px;cursor:pointer;display:flex;gap:9px;align-items:baseline}
.nav button:hover{background:var(--panel)}
.nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.nav button[aria-current="true"] small{color:var(--accent-ink);opacity:.8}
.nav .no{font-family:var(--font-mono);font-size:11px;opacity:.65;flex:none}
.nav small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.nav b{font-weight:500;font-size:14px}

.frame-right{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.content{overflow:auto;flex:1;min-height:0}
.content-in{padding-block:20px 26px;max-width:960px}
.pager{border-top:1px solid var(--line);background:var(--panel)}
.pager-in{padding-block:10px;display:flex;align-items:center;gap:10px}
.pager .mid{flex:1;text-align:center;font-size:12px;color:var(--muted);min-width:0}
button.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--body);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13.5px}
button.btn:hover{border-color:var(--accent)}
button.btn:disabled{opacity:.4;cursor:not-allowed}
button.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

h2.sec{font-size:21px;margin:0 0 4px;color:var(--title);font-weight:700;text-wrap:balance}
h3.sub{font-size:15px;margin:22px 0 8px;color:var(--title);font-weight:700}
.lead{color:var(--muted);margin:0 0 18px;font-size:13.5px;max-width:62ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi .lab{font-size:12px;color:var(--muted);margin-bottom:4px}
.kpi .val{font-family:var(--font-mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.kpi .dl{font-size:11.5px;color:var(--muted);margin-top:3px}
.pos{color:var(--ok)} .neg{color:var(--bad)}

label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select,textarea{font:inherit;font-size:14px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
textarea{min-height:92px;font-family:var(--font-mono);font-size:12.5px;line-height:1.6}
.row{display:grid;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 11px;font-size:13px}
.chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;border-radius:50%}
.chip button:hover{color:var(--bad)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.06em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel-2)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.note{background:var(--accent-soft);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:11px 13px;font-size:13px;margin:14px 0}
.bar{height:8px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
pre.code{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;font-family:var(--font-mono);font-size:12.3px;line-height:1.65;white-space:pre-wrap;word-break:break-word;margin:0}
ul.clean{margin:8px 0;padding-left:20px}
ul.clean li{margin:4px 0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;background:var(--panel);cursor:pointer}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:14px}
svg.chart{display:block;width:100%;height:auto;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:30;box-shadow:var(--shadow)}
@media (max-width:820px){
  .frame-lower{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .frame-left{border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .nav{flex-direction:row;gap:6px}
  .nav li{flex:none}
  .nav button{white-space:nowrap;padding:7px 12px}
  .nav small{display:none}
  .g4,.g3,.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:460px){ .g4,.g3,.g2{grid-template-columns:1fr} .brand p{display:none} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="frame-top">
    <div class="top-in gut">
      <div class="brand">
        <div class="mark">帳</div>
        <div>
          <h1>日常帳務管理台</h1>
          <p>記帳 · 帳單匯入 · 財務分析 · GitHub 同步</p>
        </div>
      </div>
      <div class="top-tools">
        <div class="toolgrp"><span>色系</span><div id="pal" class="chips" style="gap:6px"></div></div>
        <div class="toolgrp"><span>明暗</span>
          <div class="seg" id="thm">
            <button data-t="auto" aria-pressed="true">系統</button>
            <button data-t="light" aria-pressed="false">亮</button>
            <button data-t="dark" aria-pressed="false">暗</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="frame-lower">
    <nav class="frame-left" aria-label="重點項目">
      <div class="left-in gut">
        <p class="left-h">重 點 項 目</p>
        <ul class="nav" id="nav"></ul>
      </div>
    </nav>

    <section class="frame-right">
      <div class="content" id="scroller">
        <div class="content-in gut" id="content"></div>
      </div>
      <div class="pager">
        <div class="pager-in gut">
          <button class="btn" id="prev">← 上一頁</button>
          <div class="mid" id="pmid"></div>
          <button class="btn" id="next">下一頁 →</button>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
/* ---------- 資料 ---------- */
var KEY='ledger.v2', PKEY='ledger.pref.v2';
var CATS=['餐飲','交通','居住','娛樂','醫療','教育','購物','保險','其他','薪資','獎金'];
var INCOME_CATS=['薪資','獎金'];

function seed(){
  var r=[],id=1;
  var d=[
    ['2026-07-05','薪資','七月薪資',62000,'收入','轉帳'],
    ['2026-07-06','居住','房租',18000,'支出','轉帳'],
    ['2026-07-09','餐飲','超市採買',2480,'支出','信用卡'],
    ['2026-07-15','交通','悠遊卡加值',1000,'支出','現金'],
    ['2026-07-21','娛樂','影音訂閱',390,'支出','信用卡'],
    ['2026-07-28','購物','夏季衣物',3200,'支出','信用卡'],
    ['2026-08-05','薪資','八月薪資',62000,'收入','轉帳'],
    ['2026-08-06','居住','房租',18000,'支出','轉帳'],
    ['2026-08-11','餐飲','外食合計',6900,'支出','信用卡'],
    ['2026-08-17','醫療','牙科回診',1800,'支出','現金'],
    ['2026-08-23','交通','高鐵台北-台中',1490,'支出','信用卡'],
    ['2026-08-30','保險','醫療險季繳',7200,'支出','轉帳'],
    ['2026-09-05','薪資','九月薪資',62000,'收入','轉帳'],
    ['2026-09-06','居住','房租',18000,'支出','轉帳'],
    ['2026-09-12','餐飲','外食合計',7450,'支出','信用卡'],
    ['2026-09-14','教育','線上課程',2990,'支出','信用卡'],
    ['2026-09-25','購物','家電維修',4600,'支出','信用卡'],
    ['2026-09-28','娛樂','週末小旅行',5300,'支出','信用卡'],
    ['2026-10-05','薪資','十月薪資',62000,'收入','轉帳'],
    ['2026-10-05','獎金','專案獎金',12000,'收入','轉帳'],
    ['2026-10-06','居住','房租',18000,'支出','轉帳'],
    ['2026-10-08','餐飲','超市採買',3120,'支出','信用卡'],
    ['2026-10-11','交通','加油',1650,'支出','信用卡'],
    ['2026-10-14','娛樂','影音訂閱',390,'支出','信用卡'],
    ['2026-10-16','購物','生活用品',2180,'支出','信用卡']
  ];
  d.forEach(function(x){
    r.push({id:id++,date:x[0],ym:x[0].slice(0,7),cat:x[1],item:x[2],amount:x[3],type:x[4],pay:x[5],note:'',demo:true});
  });
  return r;
}
var S=null;
try{ var raw=localStorage.getItem(KEY); if(raw) S=JSON.parse(raw); }catch(e){}
if(!S||!S.records){
  S={records:seed(),cats:CATS.slice(),months:['2026-07','2026-08','2026-09','2026-10'],
     budgets:{'餐飲':8000,'居住':18000,'交通':3000,'娛樂':4000,'購物':5000},
     github:{owner:'',repo:'',branch:'main',path:'data/ledger.json'}};
}
if(!S.github) S.github={owner:'',repo:'',branch:'main',path:'data/ledger.json'};
if(!S.github.owner) S.github.owner='show1133';
if(!S.github.repo) S.github.repo='Accounting-data';
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* 唯讀權杖只存在這個瀏覽器，且刻意與 S 分開存放：
   S 會被「複製 JSON」等匯出功能整包讀取，權杖放進去就有外流風險。 */
var TKEY='ledger.ghtoken.v1';
function ghToken(){ try{ return localStorage.getItem(TKEY)||''; }catch(e){ return ''; } }
function setGhToken(v){ try{ v?localStorage.setItem(TKEY,v):localStorage.removeItem(TKEY); }catch(e){} }

var PREF={palette:'indigo',theme:'auto'};
try{ var p=localStorage.getItem(PKEY); if(p) PREF=JSON.parse(p); }catch(e){}
function savePref(){ try{ localStorage.setItem(PKEY,JSON.stringify(PREF)); }catch(e){} }

/* ---------- 色系 / 明暗 ---------- */
var PALETTES=[['indigo','靛藍','#3755d8'],['teal','青碧','#0e8f86'],['amber','琥珀','#b06f0d'],['rose','玫瑰','#b43b63'],['slate','石墨','#475569']];
function applyPref(){
  document.documentElement.setAttribute('data-palette',PREF.palette);
  if(PREF.theme==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',PREF.theme);
  Array.prototype.forEach.call(document.querySelectorAll('#pal .sw'),function(b){ b.setAttribute('aria-pressed',b.dataset.p===PREF.palette?'true':'false'); });
  Array.prototype.forEach.call(document.querySelectorAll('#thm button'),function(b){ b.setAttribute('aria-pressed',b.dataset.t===PREF.theme?'true':'false'); });
}
(function(){
  var h='';
  PALETTES.forEach(function(p){ h+='<button class="sw" data-p="'+p[0]+'" title="'+p[1]+'" aria-label="'+p[1]+'色系" style="background:'+p[2]+'"></button>'; });
  document.getElementById('pal').innerHTML=h;
})();
document.getElementById('pal').addEventListener('click',function(e){
  var b=e.target.closest('.sw'); if(!b) return; PREF.palette=b.dataset.p; savePref(); applyPref(); render();
});
document.getElementById('thm').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return; PREF.theme=b.dataset.t; savePref(); applyPref(); render();
});

/* ---------- 工具 ---------- */
function money(n){ return 'NT$'+Math.round(n).toLocaleString('zh-TW'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function catColor(c){
  var i=S.cats.indexOf(c); if(i<0) i=0;
  var hues=[12,205,38,268,162,330,88,242,186,52,300];
  return 'hsl('+hues[i%hues.length]+' var(--c-s) var(--c-l))';
}
function months(){
  var m={}; S.records.forEach(function(r){ m[r.ym]=1; }); (S.months||[]).forEach(function(x){ m[x]=1; });
  return Object.keys(m).sort();
}
function sumBy(list,f){ var t=0; list.forEach(function(r){ t+=f(r); }); return t; }
function monthStat(ym){
  var rs=S.records.filter(function(r){return r.ym===ym;});
  var inc=sumBy(rs,function(r){return r.type==='收入'?r.amount:0;});
  var exp=sumBy(rs,function(r){return r.type==='支出'?r.amount:0;});
  return {ym:ym,inc:inc,exp:exp,net:inc-exp,n:rs.length};
}
function toast(msg){
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(function(){ t.remove(); },2000);
}
function copyText(txt,btn){
  var done=function(){ if(btn){var o=btn.textContent;btn.textContent='已複製 ✓';setTimeout(function(){btn.textContent=o;},1600);} };
  try{ navigator.clipboard.writeText(txt).then(done,function(){ fallback(); }); }catch(e){ fallback(); }
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e2){ toast('請手動選取文字複製'); }
    ta.remove();
  }
}

/* ---------- 圖表 ---------- */
function barChart(data){
  var W=720,H=250,pl=58,pr=12,pt=14,pb=34, iw=W-pl-pr, ih=H-pt-pb;
  var max=1; data.forEach(function(d){ max=Math.max(max,d.inc,d.exp); });
  var step=Math.pow(10,Math.floor(Math.log(max)/Math.LN10)); var top=Math.ceil(max/step)*step; if(top===0)top=1;
  var n=data.length||1, gw=iw/n, bw=Math.min(26,gw/3.2);
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="每月收入與支出長條圖">';
  for(var i=0;i<=4;i++){
    var v=top*i/4, y=pt+ih-ih*i/4;
    s+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="var(--font-mono)">'+(v>=1000?(v/1000)+'k':v)+'</text>';
  }
  data.forEach(function(d,k){
    var cx=pl+gw*k+gw/2;
    var hi=ih*d.inc/top, he=ih*d.exp/top;
    s+='<rect x="'+(cx-bw-3)+'" y="'+(pt+ih-hi)+'" width="'+bw+'" height="'+Math.max(hi,1)+'" rx="3" fill="var(--ok)"/>';
    s+='<rect x="'+(cx+3)+'" y="'+(pt+ih-he)+'" width="'+bw+'" height="'+Math.max(he,1)+'" rx="3" fill="var(--bad)"/>';
    s+='<text x="'+cx+'" y="'+(H-12)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+esc(d.ym.replace('-','/'))+'</text>';
  });
  s+='</svg>';
  s+='<div class="legend"><span><i class="dot" style="background:var(--ok)"></i>收入</span><span><i class="dot" style="background:var(--bad)"></i>支出</span></div>';
  return s;
}
function donut(items){
  var tot=sumBy(items,function(i){return i.value;}); if(tot<=0) return '<p class="t-sub">此期間尚無支出資料。</p>';
  var W=300,cx=150,cy=150,R=118,r=70, a=-Math.PI/2;
  var s='<svg class="chart" viewBox="0 0 '+W+' 300" style="max-width:300px;margin:0 auto" role="img" aria-label="支出類別占比環圈圖">';
  items.forEach(function(it){
    var ang=it.value/tot*Math.PI*2, a2=a+ang, big=ang>Math.PI?1:0;
    var x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    var x3=cx+r*Math.cos(a2),y3=cy+r*Math.sin(a2),x4=cx+r*Math.cos(a),y4=cy+r*Math.sin(a);
    s+='<path d="M'+x1+' '+y1+' A'+R+' '+R+' 0 '+big+' 1 '+x2+' '+y2+' L'+x3+' '+y3+' A'+r+' '+r+' 0 '+big+' 0 '+x4+' '+y4+' Z" fill="'+catColor(it.label)+'" stroke="var(--panel)" stroke-width="2"/>';
    a=a2;
  });
  s+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="12" fill="var(--muted)">總支出</text>';
  s+='<text x="'+cx+'" y="'+(cy+20)+'" text-anchor="middle" font-size="18" font-weight="600" fill="var(--fg)" font-family="var(--font-mono)">'+money(tot)+'</text></svg>';
  s+='<div class="legend">'+items.map(function(i){
    return '<span><i class="dot" style="background:'+catColor(i.label)+'"></i>'+esc(i.label)+' '+Math.round(i.value/tot*100)+'%</span>';
  }).join('')+'</div>';
  return s;
}

/* ---------- 期間選擇（總覽、帳務明細、財務分析共用） ---------- */

function thisYm(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
/* 基準月份：以今天為準；當月還沒有任何帳務時，退到最新有資料的月份，
   免得一開啟就看到空白頁。 */
function baseYm(){
  var now=thisYm();
  if(S.records.some(function(r){ return r.ym===now; })) return now;
  var withData=S.records.map(function(r){ return r.ym; }).sort();
  return withData[withData.length-1]||now;
}
function shiftYm(ym,n){
  var y=+ym.slice(0,4), m=+ym.slice(5,7)-1+n;
  var yy=y+Math.floor(m/12), mm=((m%12)+12)%12;
  return yy+'-'+String(mm+1).padStart(2,'0');
}
/* 期間內的每個月份（含沒有帳務的月），趨勢圖才不會把空月悄悄略過。 */
function monthsInRange(r){
  var out=[], cur=r.from;
  for(var i=0;i<120&&cur<=r.to;i++){ out.push(cur); cur=shiftYm(cur,1); }
  return out;
}
function inRange(ym,r){ return ym>=r.from&&ym<=r.to; }
function rangeRecords(r){ return S.records.filter(function(x){ return inRange(x.ym,r); }); }

/* 各頁各自記住自己的期間；span 是該頁預設要涵蓋幾個月（含基準月）。 */
function getRange(key,span){
  if(!S._ranges) S._ranges={};
  var r=S._ranges[key];
  if(!r||!r.from||!r.to||r.from>r.to){
    var b=baseYm();
    r=S._ranges[key]={from:shiftYm(b,-(span-1)),to:b};
  }
  return r;
}
function rangeSpan(r){ return monthsInRange(r).length; }

/* 新匯入的帳務若落在目前檢視的期間之外，畫面上會一筆都看不到，
   看起來就像「沒有實質匯入」。這裡把各頁期間往外延伸到涵蓋新資料，
   只擴不縮，所以原本在看的月份不會被擠掉。 */
function revealMonths(yms){
  var list=(yms||[]).filter(function(y){ return y; }).sort();
  if(!list.length) return null;
  var lo=list[0], hi=list[list.length-1];
  if(!S._ranges) S._ranges={};
  ['overview','records','analysis'].forEach(function(k){
    var r=S._ranges[k];
    if(!r) return;                       // 沒設過的頁之後會自行以新的基準月重算
    if(hi>r.to) r.to=hi;
    if(lo<r.from) r.from=lo;
  });
  return lo===hi?lo:lo+' ～ '+hi;
}

/* 從起始年月往後推 n 期，每期取該月的指定日；若該月沒有那一天（例如 31 日遇到 2 月），
   就退到該月最後一天，不會溢位到下個月。 */
function recurDates(startYm,day,count){
  var out=[], y=+startYm.slice(0,4), m=+startYm.slice(5,7)-1;
  for(var i=0;i<count;i++){
    var yy=y+Math.floor((m+i)/12), mm=(m+i)%12;
    var last=new Date(yy,mm+1,0).getDate();
    var d=Math.min(day,last);
    out.push(yy+'-'+String(mm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'));
  }
  return out;
}

function buildRecurring(){
  var cfg=S._recurCfg, rows=recurRows().filter(function(r){ return r.item.trim()&&(+r.amount)>0; });
  if(!rows.length){ toast('請先填寫項目名稱與金額'); return; }
  var dates=recurDates(cfg.start,cfg.day,cfg.count);
  // 去重鍵刻意不含備註：同一天、同項目、同金額、同收支別就視為同一筆
  var seen={};
  S.records.forEach(function(r){ seen[[r.date,r.item,r.amount,r.type].join('|')]=1; });
  var made=[], skipped=0, base=Date.now();
  dates.forEach(function(d){
    rows.forEach(function(r){
      var key=[d,r.item.trim(),Math.round(+r.amount),r.type].join('|');
      if(seen[key]){ skipped++; return; }
      seen[key]=1;
      made.push({id:base+made.length,date:d,ym:d.slice(0,7),cat:r.cat,item:r.item.trim(),
        amount:Math.round(+r.amount),type:r.type,pay:r.pay,note:r.note.trim(),src:'manual'});
    });
  });
  if(!made.length){ toast('這 '+dates.length+' 期都已經建立過了'); return; }
  var total=0; made.forEach(function(r){ total+=r.amount; });
  if(!confirm('將建立 '+made.length+' 筆帳務，合計 '+money(total)+
      (skipped?'（另有 '+skipped+' 筆已存在，會略過）':'')+'。\n'+
      '期間 '+dates[0]+' 至 '+dates[dates.length-1]+'，確定？')) return;
  S.records=S.records.concat(made);
  made.forEach(function(r){ if(S.months.indexOf(r.ym)<0) S.months.push(r.ym); });
  S.months.sort();
  var where4=revealMonths(made.map(function(r){ return r.ym; }));
  save(); render();
  toast('已建立 '+made.length+' 筆（'+where4+'）'+(skipped?'，略過 '+skipped+' 筆重複':''));
}

/* ---------- 薪給清單解析（對應 Python 的 ledger/payroll.py） ----------
   薪給清單與信用卡帳單不同：一張單同時有「應發」與「應扣」，
   因此會產生多筆收入與多筆支出。匯入前一定要以單上的
   應發數小計、應扣數小計、實發金額三個數字驗算，對不上就拒絕匯入，
   絕不自行猜測漏掉的項目。 */

var PAY_AMOUNT='-?(?:\\d{1,3}(?:,\\d{3})+|\\d+)(?:\\.\\d{1,2})?';
var PAY_DATE_RE=new RegExp('(?:發薪|入帳|撥付)日期[：:](\\d{3,4})[\\/.-](\\d{1,2})[\\/.-](\\d{1,2})');
var PAY_TITLE_RE=/^(.{1,30}?)\s*[（(]\s*(?:發薪|入帳|撥付)日期/;
/* 明細列有兩種可能的取字結果：pdf.js 依座標拼行時可能插入多餘空白，
   因此先試保留空白的寬鬆式，再試整行去空白的緊湊式。 */
var PAY_ITEM_LOOSE=new RegExp('^([0-9A-Z]{2})\\s*[（(]\\s*([^)）]{1,30}?)\\s*[)）]\\s*('+PAY_AMOUNT+')\\s*(.*)$');
var PAY_ITEM_TIGHT=new RegExp('^([0-9A-Z]{2})[（(]([^)）]{1,30})[)）]('+PAY_AMOUNT+')(.*)$');
var PAY_TOTALS={gross:'應發數小計',deduction:'應扣數小計',net:'實發金額'};
/* 公司負擔或僅供參考的欄位，不屬於個人現金流 */
var PAY_IGNORE=['勞退月提繳工資','公司提繳退休金','投保金額分級','累計'];
var PAY_KEYWORDS={
  '稅費':['所得稅','補繳稅'],
  '保險':['勞保費','健保費','補充保險費','保險費','勞工保險','全民健保','團保'],
  '儲蓄投資':['持股信託提存','信託獎勵金提存','留才持股提存','持股提存','儲蓄存款']
};

function payCompact(line){ return String(line||'').replace(/\s+/g,''); }
function payMoney(t){ return Number(String(t).replace(/[,$\s]/g,'')); }

function payCategory(name,kind){
  if(kind==='收入') return '薪資';
  var text=payCompact(name);
  for(var cat in PAY_KEYWORDS){
    var ks=PAY_KEYWORDS[cat];
    for(var i=0;i<ks.length;i++) if(text.indexOf(ks[i])>=0) return cat;
  }
  return '其他';
}

function looksLikePayroll(lines){
  var all=payCompact(lines.join(''));
  return all.indexOf('應發數小計')>=0||all.indexOf('電子薪給清單')>=0||
         (all.indexOf('實發金額')>=0&&all.indexOf('薪津項目')>=0)||
         all.indexOf('入帳通知')>=0;
}

/* 回傳 {ok:true, slip:{...}} 或 {ok:false, error:'原因'} —— 絕不丟出例外，
   因為呼叫端要把原因原樣顯示給使用者。 */
function parsePayroll(lines){
  lines=(lines||[]).map(function(l){ return String(l||'').replace(/\s+/g,' ').trim(); })
                   .filter(function(l){ return l; });
  if(!lines.length) return {ok:false,error:'這份 PDF 沒有可讀取的文字。'};

  // 發薪日期（民國年轉西元）
  var date=null;
  for(var i=0;i<lines.length&&!date;i++){
    var m=PAY_DATE_RE.exec(payCompact(lines[i]));
    if(!m) continue;
    var y=+m[1]; if(y<1911) y+=1911;
    var mm=+m[2], dd=+m[3];
    var d=new Date(y,mm-1,dd);
    if(d.getFullYear()!==y||d.getMonth()!==mm-1||d.getDate()!==dd)
      return {ok:false,error:'薪給清單上的發薪日期無效：'+m[0]};
    date=y+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
  }
  if(!date) return {ok:false,error:'找不到發薪日期或入帳日期，請確認這是電子薪給清單或入帳通知。'};

  // 單別
  var title='';
  for(var j=0;j<lines.length&&!title;j++){
    if(!PAY_DATE_RE.test(payCompact(lines[j]))) continue;
    var tm=PAY_TITLE_RE.exec(lines[j]);
    if(tm&&tm[1].trim()) title=tm[1].trim();
  }
  if(!title) for(var j2=0;j2<lines.length&&!title;j2++)
    if(lines[j2].indexOf('入帳通知')>=0) title='入帳通知';
  if(!title) title='電子薪給清單';

  // 明細列
  var recs=[], gross=0, deduction=0;
  lines.forEach(function(line){
    var compact=payCompact(line);
    for(var k=0;k<PAY_IGNORE.length;k++) if(compact.indexOf(PAY_IGNORE[k])>=0) return;
    var m=PAY_ITEM_LOOSE.exec(line)||PAY_ITEM_TIGHT.exec(compact);
    if(!m) return;
    var amt=payMoney(m[3]);
    if(!amt) return;
    var kind=amt>0?'收入':'支出';
    if(kind==='收入') gross+=amt; else deduction+=-amt;
    var name=payCompact(m[2]);
    var memo=String(m[4]||'').replace(/\s+/g,' ').trim();
    recs.push({date:date,ym:date.slice(0,7),cat:payCategory(name,kind),item:name,
      amount:Math.abs(amt),type:kind,pay:'轉帳',
      note:[title,m[1],memo].filter(function(x){return x;}).join('·')});
  });
  if(!recs.length) return {ok:false,error:'這份 PDF 沒有可解析的薪津項目列（格式應為「代號(項目名) 金額」）。'};

  // 三個驗算數字
  var totals={gross:null,deduction:null,net:null};
  lines.forEach(function(line){
    var c=payCompact(line);
    for(var key in PAY_TOTALS){
      if(totals[key]!==null) continue;
      var re=new RegExp(PAY_TOTALS[key]+'\\$?('+PAY_AMOUNT+')');
      var mm2=re.exec(c);
      if(mm2) totals[key]=payMoney(mm2[1]);
    }
  });
  var expDed=totals.deduction===null?0:totals.deduction;
  if(totals.gross===null||totals.net===null)
    return {ok:false,error:'「'+title+'」找不到應發數小計或實發金額，無法對帳；請確認 PDF 是否完整（含第二頁）。'};
  if(gross!==totals.gross)
    return {ok:false,error:'「'+title+'」應發項目加總 '+money(gross)+' 與單上應發數小計 '+money(totals.gross)+
      ' 不符，可能有項目未被解析。請對照原始薪給清單手動補登，勿直接匯入。'};
  if(deduction!==expDed)
    return {ok:false,error:'「'+title+'」扣款項目加總 '+money(deduction)+' 與單上應扣數小計 '+money(expDed)+
      ' 不符，可能有項目未被解析。請對照原始薪給清單手動補登，勿直接匯入。'};
  if(totals.gross-expDed!==totals.net)
    return {ok:false,error:'「'+title+'」應發 '+money(totals.gross)+' 減應扣 '+money(expDed)+
      ' 不等於實發 '+money(totals.net)+'，請確認 PDF 內容是否被截斷。'};

  return {ok:true,slip:{title:title,date:date,gross:gross,deduction:deduction,
    net:gross-deduction,records:recs}};
}

/* 匯入薪資單：以 (日期, 項目, 金額, 備註) 去重。
   同一張清單內的同鍵列是合法的（單上本來就逐列印出，且已通過小計驗算），
   所以去重只比對「帳本既有資料」，不在這批之間互相刪。 */
function importPayroll(){
  if(!paySlip){ toast('目前沒有已解析的薪給清單'); return; }
  /* 去重鍵刻意忽略空白：pdf.js 會在文字片段之間插入空格
     （「3P 費基」對上 Python 的「3P費基」），若照字比對，
     同一筆薪資會在網頁與 Python 兩邊各存一次。 */
  var key=function(r){ return [r.date,payCompact(r.item),r.amount,payCompact(r.note||'')].join('|'); };
  var have={};
  S.records.forEach(function(r){ var k=key(r); have[k]=(have[k]||0)+1; });
  var add=[], dup=0;
  paySlip.records.forEach(function(r){
    var k=key(r);
    if(have[k]>0){ have[k]--; dup++; return; }
    add.push(r);
  });
  if(!add.length){
    var t=paySlip.title, n=paySlip.records.length;
    paySlip=null; render();
    ocrSay('這份薪給清單先前已經匯入過了。','「'+t+'」全部 '+n+
      ' 筆都已在帳本中，沒有新增任何資料。若在帳務明細看不到，請把期間調整到該發薪月份。');
    toast('「'+t+'」'+n+' 筆都已在帳本中');
    return;
  }
  if(!confirm('將匯入「'+paySlip.title+'」'+add.length+' 筆'+
      (dup?'（另有 '+dup+' 筆已存在，會略過）':'')+'。\n'+
      '應發 '+money(paySlip.gross)+'、應扣 '+money(paySlip.deduction)+
      '、實發 '+money(paySlip.net)+'，確定？')) return;
  var base=Date.now();
  add.forEach(function(r,i){
    if(S.cats.indexOf(r.cat)<0) S.cats.push(r.cat);
    if(S.months.indexOf(r.ym)<0) S.months.push(r.ym);
    S.records.push({id:base+i,date:r.date,ym:r.ym,cat:r.cat,item:r.item,amount:r.amount,
      type:r.type,pay:r.pay,note:r.note,src:'manual'});
  });
  S.months.sort();
  var where=revealMonths(add.map(function(r){ return r.ym; }));
  paySlip=null; save(); render();
  toast('已匯入 '+add.length+' 筆到 '+where+(dup?'，略過重複 '+dup+' 筆':''));
}

function pAnalysis(){
  var r=getRange('analysis',6);
  var rms=monthsInRange(r), stats=rms.map(monthStat);
  var rows=rangeRecords(r);
  var tInc=sumBy(stats,function(x){return x.inc;}), tExp=sumBy(stats,function(x){return x.exp;});
  var avgExp=rms.length?tExp/rms.length:0, rate=tInc?Math.round((tInc-tExp)/tInc*100):0;
  var last=r.to;
  var byCat={}; rows.filter(function(x){return x.type==='支出';})
    .forEach(function(x){ byCat[x.cat]=(byCat[x.cat]||0)+x.amount; });
  var items=Object.keys(byCat).map(function(k){return {label:k,value:byCat[k]};})
    .sort(function(a,b){return b.value-a.value;});

  var h='<h2 class="sec">財務分析</h2>'+
    '<p class="lead">預設分析最近六個月的收支趨勢、類別占比與預算達成，也可自行指定起訖月份。</p>'+
    rangeCard('analysis',6,'');
  h+='<div class="grid g4">'+
    '<div class="card kpi"><div class="lab">期間收入</div><div class="val pos">'+money(tInc)+'</div><div class="dl">'+rms.length+' 個月</div></div>'+
    '<div class="card kpi"><div class="lab">期間支出</div><div class="val neg">'+money(tExp)+'</div><div class="dl">'+rows.length+' 筆</div></div>'+
    '<div class="card kpi"><div class="lab">月均支出</div><div class="val">'+money(avgExp)+'</div></div>'+
    '<div class="card kpi"><div class="lab">整體儲蓄率</div><div class="val '+(rate>=0?'pos':'neg')+'">'+rate+'%</div><div class="dl">'+(rate>=20?'體質良好':rate>=0?'仍有改善空間':'入不敷出')+'</div></div></div>';

  if(!rows.length){
    h+='<div class="note" style="margin-top:12px"><span class="t-key">這段期間沒有任何帳務。</span>'+
       '<span class="t-body">請調整上方起訖月份，或按「全部」分析整本帳。</span></div>';
    return h;
  }

  h+='<h3 class="sub">收支趨勢（'+esc(r.from)+' ～ '+esc(r.to)+'）</h3><div class="card">'+barChart(stats.slice(-24))+'</div>';

  // 月支出環比：看得出哪一個月突然變重
  h+='<h3 class="sub">月支出變化</h3><div class="tblwrap"><table><thead><tr><th>月份</th>'+
     '<th style="text-align:right">支出</th><th style="text-align:right">較前月</th>'+
     '<th style="text-align:right">收入</th><th style="text-align:right">結餘</th>'+
     '<th style="text-align:right">儲蓄率</th></tr></thead><tbody>'+
     stats.map(function(st,i){
       var pv=i>0?stats[i-1].exp:0;
       var mom=pv?Math.round((st.exp-pv)/pv*100):null;
       var sr=st.inc?Math.round(st.net/st.inc*100):null;
       return '<tr><td style="font-family:var(--font-mono)">'+esc(st.ym)+'</td>'+
         '<td class="num neg">'+(st.exp?money(st.exp).slice(3):'—')+'</td>'+
         '<td class="num'+(mom===null?'':(mom>0?' neg':' pos'))+'">'+(mom===null?'—':(mom>0?'+':'')+mom+'%')+'</td>'+
         '<td class="num pos">'+(st.inc?money(st.inc).slice(3):'—')+'</td>'+
         '<td class="num '+(st.net>=0?'pos':'neg')+'">'+money(st.net).slice(3)+'</td>'+
         '<td class="num">'+(sr===null?'—':sr+'%')+'</td></tr>';
     }).join('')+'</tbody></table></div>';

  h+='<div class="grid g2" style="margin-top:12px"><div class="card">'+
     '<p class="t-sub" style="margin:0 0 8px">期間支出類別占比</p>'+donut(items.slice(0,8))+'</div>';
  h+='<div class="card"><p class="t-sub" style="margin:0 0 10px">'+esc(last)+' 預算達成</p>';
  var budCats=Object.keys(S.budgets).filter(function(c){return S.budgets[c]>0;});
  if(!budCats.length) h+='<p class="t-body" style="font-size:13.5px">尚未設定預算，請到「月份與類別管理」頁填寫。</p>';
  else h+=budCats.map(function(c){
    var used=sumBy(S.records.filter(function(x){return x.ym===last&&x.cat===c&&x.type==='支出';}),function(x){return x.amount;});
    var pct=Math.min(200,Math.round(used/S.budgets[c]*100));
    var col=pct>100?'var(--bad)':pct>80?'var(--warn)':'var(--ok)';
    return '<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>'+esc(c)+'</span><span style="font-family:var(--font-mono);color:'+col+'">'+money(used)+' / '+money(S.budgets[c])+'（'+pct+'%）</span></div><div class="bar"><i style="width:'+Math.min(100,pct)+'%;background:'+col+'"></i></div></div>';
  }).join('');
  h+='</div></div>';

  var top=items.slice(0,3).map(function(i){return i.label;}).join('、');
  var over=budCats.filter(function(c){
    var used=sumBy(S.records.filter(function(x){return x.ym===last&&x.cat===c&&x.type==='支出';}),function(x){return x.amount;});
    return used>S.budgets[c];
  });
  var peak=stats.slice().sort(function(a,b){return b.exp-a.exp;})[0]||{ym:'—',exp:0};
  h+='<h3 class="sub">觀察摘要</h3><div class="card"><ul class="clean">'+
     '<li><span class="t-sub">期間：</span><span class="t-body">'+esc(r.from)+' ～ '+esc(r.to)+'，共 '+rms.length+' 個月、'+rows.length+' 筆</span></li>'+
     '<li><span class="t-sub">支出集中於：</span><span class="t-body">'+esc(top||'—')+'</span></li>'+
     '<li><span class="t-sub">月均支出：</span><span class="t-body">'+money(avgExp)+'，最高為 '+esc(peak.ym)+'（'+money(peak.exp)+'）</span></li>'+
     (over.length?'<li><span class="t-key">'+esc(last)+' 超出預算：'+esc(over.join('、'))+'，建議下月調整。</span></li>'
                 :'<li><span class="t-body">'+esc(last)+' 各類別皆在預算內。</span></li>')+
     '</ul></div>';
  return h;
}

/* ---------- 載入 Python 帳本 ---------- */
function ledgerRows(data){
  var list=Array.isArray(data)?data:(data&&Array.isArray(data.records)?data.records:null);
  if(!list) throw new Error('檔案需為帳務陣列，或含 records 的物件');
  return list.filter(function(x){ return x&&!x.demo; }).map(function(x,n){
    var date=String(x.date||''), amount=Number(x.amount), type=x.kind||x.type||'支出';
    var cat=String(x.category||x.cat||'').trim(), item=String(x.item||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||isNaN(Date.parse(date))) throw new Error('第 '+(n+1)+' 筆日期無效');
    if(!(amount>0)||!isFinite(amount)) throw new Error('第 '+(n+1)+' 筆金額無效');
    if(type!=='收入'&&type!=='支出') throw new Error('第 '+(n+1)+' 筆收支類型無效');
    if(!cat||!item) throw new Error('第 '+(n+1)+' 筆類別或項目空白');
    // 沿用帳本自己的 id：那是跨次載入都穩定的識別碼，
    // 「已手動編輯」的紀錄要靠它才對得上，重新編號會對到別人。
    var rid=Number(x.id);
    return {id:(isFinite(rid)&&rid>0)?rid:n+1,date:date,ym:date.slice(0,7),cat:cat,item:item,
      amount:Math.round(amount*100)/100,type:type,
      pay:String(x.payment||x.pay||'現金'),note:String(x.note||'')};
  });
}
/* 載入帳本時，Python 帳本是那些紀錄的唯一來源，但使用者在網頁上
   手動新增（含週期性支出）或手動改過的內容必須原樣留著，不能被蓋掉。

   保留規則：
   - src==='manual'：網頁上自己加的，帳本裡本來就沒有 → 一律保留。
     但若帳本已出現同日期、同項目、同金額、同收支別的紀錄（代表已在 Python 端補登），
     就讓帳本版本取代，避免同一筆出現兩次。
   - edited===true：原本來自帳本、使用者改過 → 以使用者的版本為準，
     帳本中同 id 的那筆不載入。 */
function applyLedgerRows(rows,where){
  var mine=S.records.filter(function(r){ return r.src==='manual'||r.edited; });
  var incomingKeys={}, editedIds={};
  rows.forEach(function(r){ incomingKeys[[r.date,r.item,r.amount,r.type].join('|')]=1; });
  var kept=mine.filter(function(r){
    if(r.edited){ editedIds[String(r.id)]=1; return true; }
    return !incomingKeys[[r.date,r.item,r.amount,r.type].join('|')];
  });
  var fresh=rows.filter(function(r){ return !editedIds[String(r.id)]; });
  var absorbed=mine.length-kept.length;
  var detail=kept.length
    ? '\n另外保留你手動新增或改過的 '+kept.length+' 筆'+
      (absorbed?'（有 '+absorbed+' 筆帳本已收錄，改以帳本為準）':'')+'。'
    : '';
  if(!confirm('將以'+(where||'')+'的 '+fresh.length+' 筆帳務取代網頁目前由帳本而來的紀錄。'+detail+'\n確定？')) return false;
  S.records=fresh.concat(kept);
  // The Python ledger is the source of truth; drop months left over from the demo data.
  S.months=[];
  S.records.forEach(function(r){
    if(S.cats.indexOf(r.cat)<0) S.cats.push(r.cat);
    if(S.months.indexOf(r.ym)<0) S.months.push(r.ym);
  });
  S.months.sort();
  S._edit='';
  // 期間是依「當時的資料」算出來的；換了一整本帳就必須重算，
  // 否則總覽可能還停在範例資料的月份，與財務分析對不起來。
  S._ranges={};
  save(); render();
  toast('已載入 '+fresh.length+' 筆'+(kept.length?'，保留手動 '+kept.length+' 筆':''));
  return true;
}

/* 以 GitHub Contents API 取回私人倉庫的 ledger.json。
   只送 Authorization 標頭，權杖不會出現在網址列或任何查詢字串中。 */
function ghLoad(){
  var box=document.getElementById('ghmsg');
  function msg(key,body){ if(box) box.innerHTML='<div class="note"><span class="t-key">'+esc(key)+'</span><span class="t-body">'+esc(body)+'</span></div>'; }
  var field=document.getElementById('g-token');
  var token=(field&&field.value.trim())||ghToken();
  if(!token){ msg('尚未填寫權杖。','請貼上唯讀權杖，或先用下方「載入帳本檔」手動選檔。'); return; }
  var g=S.github, owner=(g.owner||'').trim(), repo=(g.repo||'').trim();
  var branch=(g.branch||'main').trim(), path=(g.path||'data/ledger.json').trim();
  if(!owner||!repo){ msg('倉庫設定不完整。','請先在上方填寫帳號與倉庫名稱並按「儲存設定」。'); return; }
  msg('讀取中…', owner+'/'+repo+' 的 '+path+'（分支 '+branch+'）');
  var url='https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo)+
          '/contents/'+path.split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(branch);
  fetch(url,{headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github.raw+json',
                      'X-GitHub-Api-Version':'2022-11-28'},cache:'no-store'})
  .then(function(res){
    if(res.status===401) throw new Error('權杖無效或已過期（401），請重新產生唯讀權杖。');
    if(res.status===403) throw new Error('權限不足（403）。請確認權杖對這個倉庫有 Contents: Read 權限，且未超過速率限制。');
    if(res.status===404) throw new Error('找不到檔案（404）。請確認倉庫名稱、分支與路徑：'+owner+'/'+repo+' → '+path+'（'+branch+'）。');
    if(!res.ok) throw new Error('GitHub 回應 '+res.status+' '+res.statusText);
    return res.text();
  })
  .then(function(text){
    var rows=ledgerRows(JSON.parse(text.replace(/^\uFEFF/,'')));
    if(field&&field.value.trim()) setGhToken(field.value.trim());  // 成功才記住權杖
    // applyLedgerRows 內已重繪整頁，不需再呼叫一次 render()
    if(!applyLedgerRows(rows,'GitHub 上')) msg('已取消。','網頁帳務未變更。');
  })
  .catch(function(err){
    var m=String(err&&err.message||err);
    if(m.indexOf('Failed to fetch')>=0) m='無法連線到 GitHub，請檢查網路或瀏覽器擴充套件是否擋下請求。';
    msg('載入失敗：',m);
  });
}

function loadLedger(file){
  var box=document.getElementById('ledgermsg');
  if(file.size>20*1024*1024){ toast('檔案過大'); return; }
  var fr=new FileReader();
  fr.onload=function(){
    var rows;
    try{ rows=ledgerRows(JSON.parse(String(fr.result).replace(/^\uFEFF/,''))); }
    catch(err){ if(box) box.innerHTML='<div class="note"><span class="t-key">載入失敗：</span><span class="t-body">'+esc(String(err&&err.message||err))+'</span></div>'; return; }
    applyLedgerRows(rows,'檔案中');
  };
  fr.onerror=function(){ toast('檔案讀取失敗'); };
  fr.readAsText(file);
}

/* ---------- PDF 解析 ---------- */
var KWMAP=[[/加油|中油|台塑|停車|捷運|客運|高鐵|台鐵|計程車|uber/i,'交通'],
  [/全聯|家樂福|超市|便利|7-?11|全家|美食|餐廳|咖啡|食品|飲/i,'餐飲'],
  [/電信|中華電信|台電|水費|瓦斯|租金|房租|管理費/i,'居住'],
  [/netflix|spotify|影城|電影|ktv|遊戲|旅|訂房/i,'娛樂'],
  [/藥局|診所|醫院|健保|牙/i,'醫療'],
  [/書|課程|補習|學費/i,'教育'],
  [/保險|人壽|產險/i,'保險'],
  [/momo|蝦皮|pchome|百貨|服飾|電商|購/i,'購物']];
function guessCat(desc){
  for(var i=0;i<KWMAP.length;i++){ if(KWMAP[i][0].test(desc) && S.cats.indexOf(KWMAP[i][1])>=0) return KWMAP[i][1]; }
  return S.cats.indexOf('其他')>=0?'其他':S.cats[0];
}
var SKIP=/本期應繳|最低應繳|循環利息|信用額度|前期餘額|繳款截止|小計|合計|總計|帳單金額|可用餘額/;
function parseLines(lines){
  var out=[], yr=new Date().getFullYear();
  var re=/(?:(\d{4})[\/\-年])?(\d{1,2})[\/\-月](\d{1,2})日?\s+(.{2,60}?)\s+\$?(-?[\d,]+(?:\.\d{1,2})?)\s*$/;
  lines.forEach(function(ln){
    var s=ln.replace(/\s+/g,' ').trim();
    if(!s||SKIP.test(s)) return;
    var m=s.match(re); if(!m) return;
    var amt=parseFloat(m[5].replace(/,/g,'')); if(!(amt>0)) return;
    var y=m[1]?+m[1]:yr, mo=('0'+m[2]).slice(-2), d=('0'+m[3]).slice(-2);
    if(+mo<1||+mo>12||+d<1||+d>31) return;
    var desc=m[4].replace(/[\s·.]+$/,'').trim();
    out.push({date:y+'-'+mo+'-'+d,item:desc,amount:Math.round(amt),cat:guessCat(desc),on:true});
  });
  return out;
}
/* 依內容判斷是薪給清單還是信用卡帳單，再交給對應的解析器。 */
function dispatchParse(lines){
  paySlip=null; pdfRows=[]; stmtTotal=null;
  if(looksLikePayroll(lines)){
    var res=parsePayroll(lines);
    if(res.ok) paySlip=res.slip;
    render();
    var b1=document.getElementById('pdfmsg');
    if(b1) b1.innerHTML = res.ok
      ? '<div class="note"><span class="t-key">已辨識為電子薪給清單。</span><span class="t-body">「'+
        esc(res.slip.title)+'」共 '+res.slip.records.length+' 筆，已與單上小計核對相符，請於下方確認後匯入。</span></div>'
      : '<div class="note"><span class="t-key">薪給清單無法匯入：</span><span class="t-body">'+esc(res.error)+'</span></div>';
    if(b1&&b1.scrollIntoView) b1.scrollIntoView({block:'nearest'});
    return;
  }
  pdfRows=parseLines(lines);
  stmtTotal=statementTotal(lines);
  afterParse();
}
function afterParse(){
  render();
  var box=document.getElementById('pdfmsg');
  if(box) box.innerHTML = pdfRows.length
    ? '<div class="note"><span class="t-sub">已辨識為信用卡帳單，共找出 '+pdfRows.length+' 筆可能的消費紀錄，請於下表核對。</span></div>'
    : '<div class="note"><span class="t-key">沒有找到可辨識的消費列。</span><span class="t-body">可能是掃描影像型帳單，或版面格式特殊；請改用下方「貼上文字」，或手動於「新增單筆／週期帳務」輸入。</span></div>';
  if(box&&box.scrollIntoView) box.scrollIntoView({block:'nearest'});
}
function importPdf(){
  var picked=pdfRows.filter(function(r){return r.on&&r.amount>0;});
  if(!picked.length){ toast('請至少勾選一筆'); return; }
  var added=0;
  picked.forEach(function(r){
    var dup=S.records.some(function(x){return x.date===r.date&&x.amount===r.amount&&x.item===r.item;});
    if(dup) return;
    S.records.push({id:Date.now()+Math.random(),date:r.date,ym:r.date.slice(0,7),cat:r.cat,item:r.item,
      amount:r.amount,type:'支出',pay:'信用卡',note:'帳單匯入',src:'manual'});
    added++;
  });
  var where3=revealMonths(picked.map(function(r){ return r.date.slice(0,7); }));
  save(); pdfRows=[]; stmtTotal=null; render();
  toast(added?('已匯入 '+added+' 筆到 '+where3+'（略過重複 '+(picked.length-added)+' 筆）')
             :'這 '+picked.length+' 筆都已在帳本中，沒有新增');
}
function bindDrop(){
  var d=document.getElementById('drop'), f=document.getElementById('file'); if(!d) return;
  d.onclick=function(){ f.click(); };
  d.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); f.click(); } };
  d.ondragover=function(e){ e.preventDefault(); d.classList.add('on'); };
  d.ondragleave=function(){ d.classList.remove('on'); };
  d.ondrop=function(e){ e.preventDefault(); d.classList.remove('on'); if(e.dataTransfer.files[0]) readPdf(e.dataTransfer.files[0]); };
  f.onchange=function(){ if(f.files[0]) readPdf(f.files[0]); };
}
/* 把 pdf.js 的文字片段還原成「一列一行」。

   原本是用 Math.round(y) 當分組鍵，但同一列文字的基線常相差零點幾個單位
   （不同字型、全半形混排都會造成），四捨五入後就被拆成兩行。
   實際後果：薪給清單的「應發數小計 110,906 存款帳號…」會變成
   「應發數小計 存款帳號」＋另一行「110,906」——金額整個脫隊，
   信用卡帳單則會因為日期與金額不在同一行而被靜默漏掉。
   改成以字高的一定比例當容差來分群，才符合視覺上的「同一列」。 */
function itemsToLines(items){
  var frags=[];
  (items||[]).forEach(function(it){
    if(!it||it.str==null||it.str==='') return;
    var tr=it.transform||[];
    var h=Math.abs(tr[3])||Math.abs(tr[0])||it.height||10;
    frags.push({x:tr[4]||0,y:tr[5]||0,h:h,s:it.str});
  });
  frags.sort(function(a,b){ return b.y-a.y||a.x-b.x; });
  var rows=[], cur=null;
  frags.forEach(function(f){
    // 容差取字高的 0.4 倍：足以吸收同列的基線誤差，又小於正常的行距
    var tol=cur?Math.max(1.5,cur.h*0.4):0;
    if(cur&&Math.abs(cur.y-f.y)<=tol){
      cur.items.push(f);
      if(f.h>cur.h) cur.h=f.h;
    }else{
      cur={y:f.y,h:f.h,items:[f]};
      rows.push(cur);
    }
  });
  return rows.map(function(row){
    row.items.sort(function(a,b){ return a.x-b.x; });
    return row.items.map(function(o){ return o.s; }).join(' ').replace(/\s+/g,' ').trim();
  }).filter(function(l){ return l; });
}

/* ---------- OCR 後援 ----------
   掃描影像型帳單（銀行寄的紙本掃描檔）沒有文字層，pdf.js 取不到字。
   這裡用 tesseract.js 在瀏覽器裡辨識，模型只在按下按鈕時才下載，
   不會拖慢平常的使用。

   OCR 一定會有誤判，所以兩道把關都保留：
   薪給清單仍須通過應發／應扣／實發三個小計的驗算才讓匯入；
   信用卡帳單則額外把解析到的金額與帳單上的「本期合計」相比，把差額攤開給使用者看。 */

var OCR_SRC='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js';

function ocrSay(key,body){
  var b=document.getElementById('pdfmsg');
  if(b) b.innerHTML='<div class="note"><span class="t-key">'+esc(key)+'</span><span class="t-body">'+esc(body)+'</span></div>';
}
function offerOcr(reason){
  var b=document.getElementById('pdfmsg');
  if(!b) return;
  b.innerHTML='<div class="note"><span class="t-key">'+esc(reason)+'</span>'+
    '<span class="t-body">可以直接在這個瀏覽器用 OCR 辨識，不必另外安裝軟體。'+
    '首次辨識要下載約 15MB 的繁體中文模型（之後瀏覽器會自行快取），一頁約需十幾秒。</span>'+
    '<div style="margin-top:10px"><button class="btn pri" data-act="runocr">用 OCR 辨識這份 PDF</button></div></div>';
}

function loadScriptOnce(src){
  return new Promise(function(resolve,reject){
    if(window.Tesseract) return resolve();
    var el=document.createElement('script');
    el.src=src;
    el.onload=function(){ resolve(); };
    el.onerror=function(){ reject(new Error('無法載入 OCR 元件，請確認網路連線')); };
    document.head.appendChild(el);
  });
}

function runOcr(){
  if(ocrBusy){ toast('辨識進行中，請稍候'); return; }
  if(!pdfDocRef){ toast('請先選擇一份 PDF'); return; }
  ocrBusy=true;
  var doc=pdfDocRef, total=doc.numPages, lines=[];
  ocrSay('準備中…','正在下載繁體中文辨識模型，首次約 15MB。');
  loadScriptOnce(OCR_SRC).then(function(){
    return window.Tesseract.createWorker('chi_tra+eng',1,{logger:function(m){
      if(m&&m.status==='recognizing text')
        ocrSay('辨識中…','第 '+(lines.__page||1)+' / '+total+' 頁，'+Math.round((m.progress||0)*100)+'%');
    }});
  }).then(function(worker){
    var chain=Promise.resolve();
    for(var i=1;i<=total;i++){
      (function(n){
        chain=chain.then(function(){
          lines.__page=n;
          ocrSay('辨識中…','正在處理第 '+n+' / '+total+' 頁…');
          return doc.getPage(n).then(function(pg){
            // 放大再辨識，小字的數字才不會糊掉（金額被截斷多半就是這樣來的）
            var vp=pg.getViewport({scale:2.4});
            var cv=document.createElement('canvas');
            cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height);
            return pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise
              .then(function(){ return worker.recognize(cv); })
              .then(function(res){
                String((res&&res.data&&res.data.text)||'').split('\n').forEach(function(t){
                  t=t.replace(/\s+/g,' ').trim();
                  if(t) lines.push(t);
                });
                cv.width=cv.height=0;   // 釋放畫布，多頁帳單才不會吃光記憶體
              });
          });
        });
      })(i);
    }
    return chain.then(function(){ return worker.terminate(); });
  }).then(function(){
    ocrBusy=false; ocrUsed=true;
    delete lines.__page;
    if(!lines.length){
      ocrSay('OCR 沒有辨識出任何文字。','這份 PDF 可能是空白頁或影像品質太低，請改用下方「貼上文字」。');
      return;
    }
    dispatchParse(lines);
    if(!pdfRows.length&&!paySlip)
      ocrSay('OCR 完成，但找不到可辨識的資料列。','辨識出 '+lines.length+' 行文字，格式可能與預期不同；請改用下方「貼上文字」自行整理。');
  }).catch(function(err){
    ocrBusy=false;
    ocrSay('OCR 失敗：',String(err&&err.message||err));
  });
}

/* 帳單上的本期合計：OCR 誤判最常見的後果是金額被截斷（50 變成 5），
   把解析結果和這個數字相比，差額一眼就看得出來。 */
function statementTotal(lines){
  var pats=[/本期應繳總金額\$?(-?[\d,]+(?:\.\d{1,2})?)/,/本期合計\$?(-?[\d,]+(?:\.\d{1,2})?)/,
            /本期新增款項\$?(-?[\d,]+(?:\.\d{1,2})?)/];
  for(var i=0;i<lines.length;i++){
    var c=payCompact(lines[i]);
    for(var j=0;j<pats.length;j++){
      var m=pats[j].exec(c);
      if(m){ var v=Number(m[1].replace(/,/g,'')); if(isFinite(v)&&v>0) return v; }
    }
  }
  return null;
}

function readPdf(file){
  var box=document.getElementById('pdfmsg');
  if(box) box.innerHTML='<div class="note"><span class="t-sub">正在讀取 '+esc(file.name)+' …</span></div>';
  if(!window.pdfjsLib){ if(box) box.innerHTML='<div class="note"><span class="t-key">PDF 解析元件載入失敗。</span><span class="t-body">請改用下方「貼上帳單文字」功能。</span></div>'; return; }
  try{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
  var fr=new FileReader();
  fr.onload=function(){
    // CMaps let pdf.js decode CJK CID fonts (common in Taiwanese bank statements).
    pdfjsLib.getDocument({data:new Uint8Array(fr.result),
      cMapUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',cMapPacked:true}).promise.then(function(doc){
      pdfDocRef=doc; pdfDocName=file.name; ocrUsed=false;   // 留著供 OCR 後援重新算圖
      var jobs=[];
      for(var i=1;i<=doc.numPages;i++) jobs.push(doc.getPage(i).then(function(pg){ return pg.getTextContent(); }));
      return Promise.all(jobs);
    }).then(function(pages){
      var lines=[], itemCount=0;
      pages.forEach(function(tc){
        itemCount+=tc.items.length;
        lines=lines.concat(itemsToLines(tc.items));
      });
      var usable=lines.join('').replace(/\s/g,'').length;
      // 文字層太少（掃描影像，或字型無法轉成可讀文字）就直接提供 OCR
      if(usable<40){ offerOcr(itemCount?'這份 PDF 有文字，但字型無法轉成可讀文字。':'這份 PDF 沒有文字層，應為掃描影像。'); return; }
      dispatchParse(lines);
      if(!pdfRows.length && !paySlip) offerOcr('讀到文字了，但找不到可辨識的消費列或薪津項目。');
    }).catch(function(err){
      var b3=document.getElementById('pdfmsg');
      if(b3) b3.innerHTML='<div class="note"><span class="t-key">讀取失敗：</span><span class="t-body">'+esc(String(err&&err.message||err))+'。若為加密帳單，請先解除密碼保護，或改用下方貼上文字。</span></div>';
    });
  };
  fr.onerror=function(){ if(box) box.innerHTML='<div class="note"><span class="t-key">檔案讀取失敗，請再試一次。</span></div>'; };
  fr.readAsArrayBuffer(file);
}

applyPref();
render();
</script>
